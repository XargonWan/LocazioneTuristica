{% extends 'base.html' %}

{% block content %}
{% set return_url = next if next is defined and next else '/anagrafiche' %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Modifica Ditta / Fornitore</h5>
        <form method="post" action="/anagrafiche/company/{{ company.id }}/edit">
          <input type="hidden" name="next" value="{{ return_url }}">
          <div class="mb-3">
            <label class="form-label">Nome Ditta</label>
            <input class="form-control" type="text" name="company_name" value="{{ company.company_name }}" required>
          </div>
          <div class="mb-3 form-check">
            <input class="form-check-input" type="checkbox" id="companyCleaningFlag" name="is_cleaning_company" value="1" {% if company.is_cleaning_company %}checked{% endif %}>
            <label class="form-check-label" for="companyCleaningFlag">Ditta di pulizie</label>
          </div>
          <div id="cleaningDefaultsSection" {% if not company.is_cleaning_company %}style="display:none"{% endif %}>
            <div class="mb-3">
              <label class="form-label">Costo standard lordo (€)</label>
              <input class="form-control" type="number" step="0.01" min="0" name="default_gross_amount" value="{{ '%.2f'|format(company.default_gross_amount) if company.default_gross_amount is not none else '' }}">
            </div>
            <div class="mb-3">
              <label class="form-label">Costo standard imponibile (€)</label>
              <input class="form-control" type="number" step="0.01" min="0" name="default_net_amount" value="{{ '%.2f'|format(company.default_net_amount) if company.default_net_amount is not none else '' }}">
            </div>
          </div>
          <button class="btn btn-primary" type="submit">Salva</button>
          <a class="btn btn-secondary" href="{{ return_url }}">Annulla</a>
        </form>
        <script>
          (function(){
            const cb = document.getElementById('companyCleaningFlag');
            const section = document.getElementById('cleaningDefaultsSection');
            if(cb && section){
              cb.addEventListener('change', () => {
                section.style.display = cb.checked ? '' : 'none';
              });
            }
          })();
        </script>
        <form method="post" action="/anagrafiche/company/{{ company.id }}/delete" class="mt-2">
          <input type="hidden" name="next" value="{{ return_url }}">
          <button class="btn btn-danger" type="submit">Elimina Ditta</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
