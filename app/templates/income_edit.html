{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-8">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Modifica Entrata</h5>
        <form method="post" action="/money/incomes/{{ income.id }}/edit">
          <div class="mb-3">
            <label>Data</label>
            <input type="date" name="date" class="form-control" value="{{ income.date }}" required>
          </div>
          <div class="mb-3">
            <label>Importo lordo</label>
            <input type="number" name="gross_amount" step="0.01" class="form-control" value="{{ income.gross_amount }}" required>
          </div>
          <div class="mb-3">
            <label>IVA (%)</label>
            <input type="number" name="vat_percent" step="0.01" class="form-control" value="{{ income.vat_percent }}">
          </div>
          <div class="mb-3">
            <label>Percentuale PM (%)</label>
            <input type="number" name="pm_percent" step="0.01" class="form-control" value="{{ income.pm_percent }}">
          </div>
          <div class="mb-3">
            <label>Appartamento</label>
            <select name="apartment_id" class="form-control">
              <option value="">---</option>
              {% for a in apartments %}
                <option value="{{ a.id }}" {% if a.id == income.apartment_id %}selected{% endif %}>{{ a.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label>Piattaforma</label>
            <select name="platform_id" class="form-control">
              <option value="">---</option>
              {% for p in platforms %}
                <option value="{{ p.id }}" {% if p.id == income.platform_id %}selected{% endif %}>{{ p.name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label>Associata a (PM)</label>
            <select name="associated_pm_id" class="form-control">
              <option value="">---</option>
              {% for pm in pms %}
                <option value="{{ pm.id }}" {% if pm.id == income.associated_pm_id %}selected{% endif %}>{{ pm.first_name }} {{ pm.last_name }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label>Note</label>
            <textarea name="notes" class="form-control">{{ income.notes }}</textarea>
          </div>
          <div class="mb-3">
            <label>Allegati</label>
            <ul>
              {% for a in attached %}
                <li><a href="/attachments/download/{{ a.id }}" target="_blank">{{ a.filename }}</a></li>
              {% else %}
                <li>Nessun allegato</li>
              {% endfor %}
            </ul>
          </div>
          <button class="btn btn-primary" type="submit">Salva</button>
          <a class="btn btn-secondary ms-2" href="/money/incomes">Annulla</a>
        </form>
        <form method="post" action="/money/incomes/{{ income.id }}/delete" class="mt-2">
          <button class="btn btn-danger" type="submit">Elimina</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
