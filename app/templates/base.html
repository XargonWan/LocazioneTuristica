<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LocazioneTuristica</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <script>
      // Apply theme early to avoid white flash when cookie indicates dark mode
      (function(){
        try {
          const m = document.cookie.match(/(?:^|; )theme=(dark|light)(?:;|$)/);
          if (m && m[1] === 'dark') {
            document.documentElement.setAttribute('data-theme','dark');
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          // ignore
        }
      })();
    </script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
      <div class="container-fluid">
        <a class="navbar-brand" href="/overview">LocazioneTuristica</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
          <!-- Inline SVG toggler uses CSS var --text for color so it's visible in dark/light theme -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--text)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
          <div class="navbar-nav">
            <a class="nav-link" href="/overview">Rendiconto</a>
            <a class="nav-link" href="/anagrafiche">Anagrafiche</a>
            <a class="nav-link" href="/cleaning">Pulizie</a>
            <a class="nav-link" href="/stats">Statistiche</a>
            <a class="nav-link" href="/settings">Impostazioni</a>
          </div>
          <div class="d-flex ms-auto align-items-center">
          <button id="theme-toggle" class="btn btn-outline-secondary" title="Toggle theme" aria-pressed="false" aria-label="Toggle theme">
            <!-- Sun icon -->
            <svg id="theme-sun" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block;vertical-align:middle;">
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
            <!-- Moon icon -->
            <svg id="theme-moon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;vertical-align:middle;">
              <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"></path>
            </svg>
          </button>
          {% if request.session.get('username') %}
            <div class="ms-3">{{ request.session.get('username') }} - <a href="/auth/logout">Logout</a></div>
          {% else %}
            <a class="btn btn-outline-primary ms-2" href="/login">Login</a>
          {% endif %}
          </div>
        </div>
      </div>
    </nav>

    <div class="container mt-4">
      {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Chart.js for graphs -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
      const themeToggle = document.getElementById('theme-toggle');
      const themeSun = document.getElementById('theme-sun');
      const themeMoon = document.getElementById('theme-moon');
      // initialize icon based on cookie
      function getCookie(name) {
        const cookies = document.cookie.split(';').map(c => c.trim());
        for (const c of cookies) {
          if (c.startsWith(name + '=')) return c.split('=')[1];
        }
        return null;
      }
      const savedTheme = getCookie('theme');
      if (savedTheme === 'dark') {
        document.body.classList.remove('bg-light');
        document.body.classList.add('dark', 'bg-body');
        document.body.setAttribute('data-theme', 'dark');
        if (themeMoon) themeMoon.style.display = 'inline-block';
        if (themeSun) themeSun.style.display = 'none';
        if (themeToggle) themeToggle.setAttribute('aria-pressed', 'true');
      } else {
        document.body.classList.remove('dark');
        document.body.classList.add('bg-light');
        document.body.removeAttribute('data-theme');
        if (themeSun) themeSun.style.display = 'inline-block';
        if (themeMoon) themeMoon.style.display = 'none';
        if (themeToggle) themeToggle.setAttribute('aria-pressed', 'false');
      }
      if (themeToggle) {
        themeToggle.addEventListener('click', () => {
          const body = document.body;
          const html = document.documentElement;
          const isDark = body.classList.toggle('dark');
          if (isDark) {
            body.classList.remove('bg-light');
            body.classList.add('bg-body');
            body.setAttribute('data-theme', 'dark');
            html.setAttribute('data-theme', 'dark');
            if (themeMoon) themeMoon.style.display = 'inline-block';
            if (themeSun) themeSun.style.display = 'none';
            themeToggle.setAttribute('aria-pressed', 'true');
          } else {
            body.classList.remove('bg-body');
            body.classList.add('bg-light');
            body.removeAttribute('data-theme');
            html.removeAttribute('data-theme');
            if (themeSun) themeSun.style.display = 'inline-block';
            if (themeMoon) themeMoon.style.display = 'none';
            themeToggle.setAttribute('aria-pressed', 'false');
          }
          // persist
          document.cookie = `theme=${isDark ? 'dark' : 'light'}; path=/`;
        });
      }
      // Collapse details toggle text to show [+] when collapsed and [-] when open
      document.addEventListener('DOMContentLoaded', function() {
        document.querySelectorAll('.details-toggle').forEach(btn => {
          const target = btn.getAttribute('data-bs-target');
          const el = document.querySelector(target);
          // set text based on initial state
          if (el && el.classList.contains('show')) {
            btn.textContent = '[-]';
            btn.setAttribute('aria-expanded', 'true');
          } else {
            btn.textContent = '[+]';
            btn.setAttribute('aria-expanded', 'false');
          }
          // listen to bootstrap collapse events
          if (el) {
            el.addEventListener('shown.bs.collapse', () => { btn.textContent = '[-]'; btn.setAttribute('aria-expanded', 'true'); });
            el.addEventListener('hidden.bs.collapse', () => { btn.textContent = '[+]'; btn.setAttribute('aria-expanded', 'false'); });
          }
        });
      });
      // Overview per-year chart loader
      async function loadOverviewYearly(year) {
        const res = await fetch(`/api/stats/monthly?year=${year}`, { credentials: 'same-origin' });
        if (!res.ok) {
          console.error('Failed to load monthly stats for year', year);
          return null;
        }
        const js = await res.json();
        return js; // return entire object including totals
      }
      function renderOverviewChart(data) {
        const el = document.getElementById('overview-chart');
        if (!el) return; // if there's no chart on the page, do nothing
        const labels = data.map(d => d.month_name);
        const incomes = data.map(d => +d.income);
        const expenses = data.map(d => +d.expense);
        const ctx = el.getContext('2d');
        if (window.overviewChart) { window.overviewChart.destroy(); }
        const incomeColor = (getComputedStyle(document.documentElement).getPropertyValue('--income-color') || '#1fa64a').trim();
        const expenseColor = (getComputedStyle(document.documentElement).getPropertyValue('--expense-color') || '#d9534f').trim();
        window.overviewChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: labels,
            datasets: [
              { label: 'Entrate', data: incomes, backgroundColor: incomeColor },
              { label: 'Spese', data: expenses, backgroundColor: expenseColor }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { tooltip: { mode: 'index' }, legend: { position: 'top' } },
            scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true } }
          }
        });
      }
      function renderOverviewTable(data) {
        const tbody = document.querySelector('#overview-table tbody');
        tbody.innerHTML = '';
        data.forEach(d => {
          const net = (Number(d.income) - Number(d.expense));
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td>${d.month_name}</td>
            <td class="text-end">€${Number(d.income).toFixed(2)}</td>
            <td class="text-end">€${Number(d.expense).toFixed(2)}</td>
            <td class="text-end ${net>0? 'net-positive' : net<0 ? 'net-negative' : 'net-zero'}">€${net.toFixed(2)}</td>
          `;
          tbody.appendChild(tr);
        });
      }
      function initOverviewControls() {
        const sel = document.getElementById('overview-year');
        if (!sel) return;
        const now = new Date();
        const defaultYearFromServer = '{{ year | default('') }}';
        const year = defaultYearFromServer ? parseInt(defaultYearFromServer, 10) : now.getFullYear();
        // if server provided an explicit list of years with data, use it instead
        if (window.overviewAvailableYears && Array.isArray(window.overviewAvailableYears) && window.overviewAvailableYears.length) {
          window.overviewAvailableYears.forEach(y => {
            const o = document.createElement('option'); o.value = y; o.text = y; sel.appendChild(o);
          });
        } else {
          for (let y = year; y >= year - 5; --y) {
            const o = document.createElement('option'); o.value = y; o.text = y; sel.appendChild(o);
          }
        }
        sel.value = year;
        const refresh = document.getElementById('overview-refresh');
        async function refreshHandler() {
          const yr = sel.value;
          const js = await loadOverviewYearly(yr);
          if (!js) return;
          renderOverviewChart(js.data);
          renderOverviewTable(js.data);
          // update totals
          const totals = js.totals || {};
          const elInc = document.getElementById('tot-inc');
          const elExp = document.getElementById('tot-exp');
          const elPm = document.getElementById('tot-pm');
          const elPmPct = document.getElementById('tot-pm-pct');
          if (elInc) elInc.textContent = `€${Number(totals.income || 0).toFixed(2)}`;
          if (elExp) elExp.textContent = `€${Number(totals.expense || 0).toFixed(2)}`;
          if (elPm) elPm.textContent = `€${Number(totals.pm_paid || 0).toFixed(2)}`;
          if (elPmPct) elPmPct.textContent = `${Number(totals.pm_percent || 0).toFixed(2)}%`;
        }
        refresh.addEventListener('click', refreshHandler);
        // initial load
        refreshHandler();
      }
      document.addEventListener('DOMContentLoaded', initOverviewControls);
      // Global toggleEditMode fallback: attach a function to window so inline onclick can call it
      if (!window.toggleEditMode) {
        window.toggleEditMode = function(type){
          const cfg = {
            incomes: { checkboxSel: '.multi-select-checkbox', selSel: '.sel-income', editBtnId: 'editModeToggle', bulkEditBtnId: 'bulkEditBtn', bulkDeleteBtnId: 'bulkDeleteBtn', selectAllId: 'selectAllIncomes', updateCounts: function(){ if (typeof updateCounts === 'function') updateCounts(); } },
            expenses: { checkboxSel: '.multi-select-checkbox-exp', selSel: '.sel-expense', editBtnId: 'editModeToggleExp', bulkEditBtnId: 'bulkEditExpBtn', bulkDeleteBtnId: 'bulkDeleteExpBtn', selectAllId: 'selectAllExpenses', updateCounts: function(){ if (typeof updateCounts === 'function') updateCounts(); } },
            overview: { checkboxSel: '.sel-ov', selSel: '.sel-ov', editBtnId: 'editModeToggleOv', bulkEditBtnId: 'bulkEditOvBtn', bulkDeleteBtnId: 'bulkDeleteOvBtn', selectAllId: 'selectAllOv', updateCounts: function(){ if (typeof updateCounts === 'function') updateCounts(); } }
          }[type];
          if (!cfg) return;
          const first = document.querySelector(cfg.checkboxSel);
          const isActive = first ? !first.classList.contains('d-none') : false;
          // toggle visibility
          document.querySelectorAll(cfg.checkboxSel).forEach(el => el.classList.toggle('d-none', isActive));
          const bulkEditBtn = document.getElementById(cfg.bulkEditBtnId);
          const bulkDeleteBtn = document.getElementById(cfg.bulkDeleteBtnId);
          const selectAll = document.getElementById(cfg.selectAllId);
          if (bulkEditBtn) bulkEditBtn.classList.toggle('d-none', isActive);
          if (bulkDeleteBtn) bulkDeleteBtn.classList.toggle('d-none', isActive);
          if (selectAll) {
            selectAll.classList.toggle('d-none', isActive);
            // hide surrounding label as well so the "Seleziona tutto" text isn't visible outside edit mode
            const lbl = selectAll.closest && selectAll.closest('label');
            if (lbl) lbl.classList.toggle('d-none', isActive);
          }
          // toggle body class and button visuals
          const btn = document.getElementById(cfg.editBtnId);
          if (btn) {
            btn.classList.toggle('btn-primary', !isActive);
            btn.classList.toggle('btn-outline-primary', isActive);
            btn.textContent = isActive ? 'Modifica...' : 'Fatto';
          }
          if (isActive) {
            // exiting edit mode => clear selections
            document.querySelectorAll(cfg.selSel).forEach(cb => { cb.checked = false; });
            if (selectAll) selectAll.checked = false;
            // update counts if available
            try { cfg.updateCounts(); } catch (e) { /* ignore */ }
          }
        };
      }

      // Global click delegate for edit-mode toggles.
      // This makes the "Modifica..." button work even if a per-page DOMContentLoaded script failed.
      (function(){
        try {
          document.addEventListener('click', function(e){
            const t = e.target;
            if (!t || !t.closest) return;
            const btn = t.closest('#editModeToggle, #editModeToggleExp, #editModeToggleOv');
            if (!btn) return;
            // Prevent any other handlers from swallowing the click.
            try { e.preventDefault(); e.stopImmediatePropagation(); } catch (err) { /* ignore */ }
            if (btn.id === 'editModeToggle') return window.toggleEditMode && window.toggleEditMode('incomes');
            if (btn.id === 'editModeToggleExp') return window.toggleEditMode && window.toggleEditMode('expenses');
            if (btn.id === 'editModeToggleOv') return window.toggleEditMode && window.toggleEditMode('overview');
          }, true); // capture
        } catch (e) {
          // ignore
        }
      })();
      // Safe modal show helper (returns true on success, false on failure)
      if (!window.showModalSafe) {
        window.showModalSafe = function(modalElOrId){
          try {
            const modalEl = (typeof modalElOrId === 'string') ? document.getElementById(modalElOrId) : modalElOrId;
            if (!modalEl) return false;
            // use Bootstrap's getOrCreateInstance to avoid double instantiation
            const m = bootstrap.Modal.getOrCreateInstance(modalEl);
            m.show();
            return true;
          } catch (e) {
            console.debug('showModalSafe: bootstrap modal show failed', e);
            return false;
          }
        };
      }

      // Small visual banner to indicate fallback flows (auto-hide after a few seconds)
      if (!window.showFallbackBanner) {
        window.showFallbackBanner = function(msg, timeoutMs=4000){
          try {
            let b = document.getElementById('fallback-banner');
            if (!b) {
              b = document.createElement('div');
              b.id = 'fallback-banner';
              b.style.position = 'fixed';
              b.style.top = '12px';
              b.style.left = '50%';
              b.style.transform = 'translateX(-50%)';
              b.style.zIndex = 11000;
              b.style.minWidth = '320px';
              b.className = 'alert alert-warning shadow-sm';
              document.body.appendChild(b);
            }
            b.textContent = msg;
            b.style.display = 'block';
            setTimeout(()=>{ b.style.display = 'none'; }, timeoutMs);
          } catch (e) { /* ignore */ }
        };
      }
    </script>
  </body>
</html>
