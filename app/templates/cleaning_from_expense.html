{% extends 'base.html' %}

{% block content %}
<h1>Nuova Pulizia da Spesa</h1>
<div class="card">
  <div class="card-body">
    <form method="post" action="/cleaning/add">
      <input type="hidden" name="expense_id" value="{{ prefill.expense_id }}">
      <div class="mb-3">
        <label>Data</label>
        <input type="date" name="date" class="form-control" required value="{{ prefill.date }}">
      </div>
      <div class="mb-3">
        <label>Appartamento</label>
        <select name="apartment_id" class="form-control" required>
          <option value="">---</option>
          {% for apt in apartments %}
          <option value="{{ apt.id }}" {% if prefill.apartment_id == apt.id %}selected{% endif %}>{{ apt.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label>Ditta di pulizie</label>
        <select name="company_id" class="form-control" id="cleaning_company_select" required>
          <option value="">---</option>
          {% for comp in companies %}
          <option value="{{ comp.id }}" {% if prefill.company_id == comp.id or last_company_id == comp.id %}selected{% endif %}>{{ comp.company_name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label>Servizio</label>
        <select name="service_id" class="form-control" id="cleaning_service_select">
          <option value="">personalizzato</option>
          {% for svc in services %}
          <option value="{{ svc.id }}" data-amount="{{ svc.default_amount }}" data-is-net="{{ '1' if svc.is_net else '0' }}" data-vat="{{ svc.vat_percent }}" data-company="{{ svc.company_id }}">{{ svc.name }} ({{ svc.default_amount }})</option>
          {% endfor %}
        </select>
      </div>
      <div class="mb-3">
        <label>Importo lordo</label>
        <input type="number" name="gross_amount" step="0.01" class="form-control" id="cleaning_gross" value="{{ prefill.gross_amount }}">
      </div>
      <div class="mb-3">
        <label title="L'imponibile e l'importo al netto dell'IVA, base su cui si calcola l'IVA.">Imponibile</label>
        <input type="number" name="net_amount" step="0.01" class="form-control" id="cleaning_net" value="">
      </div>
      <div class="mb-3">
        <label>IVA calcolata</label>
        <input type="number" step="0.01" class="form-control" id="cleaning_vat_amount" value="" readonly tabindex="-1">
      </div>
      <div class="mb-3">
        <label>IVA (%)</label>
        <input type="number" name="vat_percent" step="0.01" class="form-control" id="cleaning_vat" value="{{ prefill.vat_percent }}">
      </div>
      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="cleaning_is_net" name="is_net" value="1">
        <label class="form-check-label" for="cleaning_is_net">Importo inserito come imponibile</label>
      </div>
      <div class="mb-3">
        <label>Note</label>
        <textarea name="notes" class="form-control">{{ prefill.notes }}</textarea>
      </div>
      <div class="mb-3">
        <button class="btn btn-primary">Salva</button>
        <a class="btn btn-secondary" href="/overview">Annulla</a>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  const svcSel = document.getElementById('cleaning_service_select');
  const grossInput = document.getElementById('cleaning_gross');
  const netInput = document.getElementById('cleaning_net');
  const vatAmountInput = document.getElementById('cleaning_vat_amount');
  const vatInput = document.getElementById('cleaning_vat');
  const isNetChk = document.getElementById('cleaning_is_net');
  const compSel = document.getElementById('cleaning_company_select');

  if(compSel && svcSel){
    // Filter services by company on load
    const currComp = compSel.value;
    Array.from(svcSel.options).forEach(o=>{
      if(!o.value) return;
      o.style.display = (o.getAttribute('data-company') === currComp) ? 'block' : 'none';
    });

    compSel.addEventListener('change', ()=>{
      const cid = compSel.value;
      Array.from(svcSel.options).forEach(o=>{
        if(!o.value) return;
        o.style.display = (o.getAttribute('data-company') === cid) ? 'block' : 'none';
      });
      svcSel.value = '';
      // Clear amounts when company changes
      if(grossInput) grossInput.value = '';
      if(netInput) netInput.value = '';
      if(vatAmountInput) vatAmountInput.value = '';
    });
  }

  if(svcSel){
    svcSel.addEventListener('change', ()=>{
      const opt = svcSel.options[svcSel.selectedIndex];
      if(opt && opt.value){
        const amt = opt.getAttribute('data-amount');
        const isNet = opt.getAttribute('data-is-net')==='1';
        const vat = opt.getAttribute('data-vat');
        const comp = opt.getAttribute('data-company');
        if(compSel) compSel.value = comp;
        if(vatInput) vatInput.value = vat;
        if(isNetChk) isNetChk.checked = isNet;
        if(isNet){
          if(netInput) netInput.value = amt;
          if(grossInput) grossInput.value = '';
        } else {
          if(grossInput) grossInput.value = amt;
          if(netInput) netInput.value = '';
        }
        syncDerivedAmounts();
      }
    });
  }

  function parseAmount(input){
    if (!input) {
      return null;
    }
    const rawValue = input.value.trim();
    if (rawValue === '') {
      return null;
    }
    const parsedValue = parseFloat(rawValue);
    return Number.isFinite(parsedValue) ? parsedValue : null;
  }

  function formatAmount(value){
    return Number.isFinite(value) ? value.toFixed(2) : '';
  }

  function syncDerivedAmounts(){
    const vat = parseAmount(vatInput) ?? 0.0;
    const vatFactor = 1 + (vat / 100.0);
    if (isNetChk && isNetChk.checked) {
      const net = parseAmount(netInput);
      if (net === null || vatFactor <= 0) {
        if (grossInput) grossInput.value = '';
        if (vatAmountInput) vatAmountInput.value = '';
        return;
      }
      const gross = net * vatFactor;
      if (grossInput) grossInput.value = formatAmount(gross);
      if (vatAmountInput) vatAmountInput.value = formatAmount(gross - net);
      return;
    }

    const gross = parseAmount(grossInput);
    if (gross === null || vatFactor <= 0) {
      if (netInput) netInput.value = '';
      if (vatAmountInput) vatAmountInput.value = '';
      return;
    }
    const net = gross / vatFactor;
    if (netInput) netInput.value = formatAmount(net);
    if (vatAmountInput) vatAmountInput.value = formatAmount(gross - net);
  }

  if(grossInput) grossInput.addEventListener('input', syncDerivedAmounts);
  if(netInput) netInput.addEventListener('input', syncDerivedAmounts);
  if(vatInput) vatInput.addEventListener('input', syncDerivedAmounts);
  if(isNetChk) isNetChk.addEventListener('change', syncDerivedAmounts);

  syncDerivedAmounts();
})();
</script>
{% endblock %}
