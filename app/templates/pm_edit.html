{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h5 class="card-title">Modifica Property Manager</h5>
        <form method="post" action="/anagrafiche/property-manager/{{ pm.id }}/edit">
          <div class="mb-3">
            <label class="form-label">Nome</label>
            <input class="form-control" type="text" name="first_name" value="{{ pm.first_name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Cognome</label>
            <input class="form-control" type="text" name="last_name" value="{{ pm.last_name }}" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Appartamenti associati</label>
            <div>
              {% for apt in apartments %}
                <div class="form-check">
                  <input class="form-check-input" type="checkbox" name="apartment_ids" value="{{ apt.id }}" id="apt-{{ apt.id }}" {% if apt.property_manager_id == pm.id %}checked{% endif %}>
                  <label class="form-check-label" for="apt-{{ apt.id }}">{{ apt.name }}</label>
                </div>
              {% else %}
                <small class="text-muted">Nessun appartamento disponibile</small>
              {% endfor %}
            </div>
          </div>
          <button class="btn btn-primary" type="submit">Salva</button>
        </form>
        <!-- Add apartment directly to this PM -->
        <form method="post" action="/anagrafiche/apartment/add" class="mt-3">
          <div class="input-group">
            <input class="form-control" type="text" name="name" placeholder="Nuovo appartamento" required>
            <input type="hidden" name="property_manager_id" value="{{ pm.id }}">
            <button class="btn btn-outline-primary" type="submit">Aggiungi appartamento</button>
          </div>
        </form>
        <!-- Assign existing apartment to this PM using combo box -->
        <form method="post" action="/anagrafiche/apartment/assign" class="mt-3">
          <div class="input-group">
            <select name="apartment_id" class="form-select">
              <option value="">-- Seleziona appartamento esistente --</option>
              {% for apt in apartments %}
                <option value="{{ apt.id }}">{{ apt.name }}{% if apt.property_manager_id and apt.property_manager_id != pm.id %} (assegnato a {{ apt.property_manager.first_name }} {{ apt.property_manager.last_name }}){% endif %}</option>
              {% endfor %}
            </select>
            <input type="hidden" name="property_manager_id" value="{{ pm.id }}">
            <button class="btn btn-outline-primary" type="submit">Assegna</button>
          </div>
        </form>
        <form method="post" action="/anagrafiche/property-manager/{{ pm.id }}/delete" class="mt-2">
          <button class="btn btn-danger" type="submit">Elimina PM</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
